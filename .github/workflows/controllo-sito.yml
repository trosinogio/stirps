# Controllo del sito pubblicato, da un ramo di servizio (la sandbox non raggiunge Vercel): le pagine toccate dall'ultima
# pubblicazione, con lo stato e un pezzo del contenuto.
name: Controllo del sito
on:
  push:
    branches: ['controllo-sito']
jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - name: Pagine
        run: |
          S=https://dizionario-etimologico.vercel.app
          prova() { curl -s -o /tmp/p.html -w "%{http_code} %{size_download}B" "$S$1"; printf ' %s | ' "$1"; grep -o "$2" /tmp/p.html | head -${3:-2} | tr '\n' ' '; echo; }
          prova /it/w/ine-pro/h3donts 'glossa-g[^<]*<[^<]*<[^<]*<[^<]*\|href="/it/[wr]/[a-z-]*/[^"]*"' 6
          prova /it/w/ine-pro/h3ed-4 'glossa-g[^<]*<[^<]*<[^<]*<[^<]*\|href="/it/[wr]/[a-z-]*/[^"]*"' 4
          prova /it/w/ine-pro/h2ner 'glossa-g[^<]*<[^<]*<[^<]*<[^<]*\|href="/it/[wr]/[a-z-]*/[^"]*"' 6
          prova /it/r/ine-pro/kap-2 '[0-9.]* parole' 3
          prova /it/r/ine-pro/kap-3 '[0-9.]* parole' 3
          prova /it/w/ar/kitab 'glossa-g[^<]*<[^<]*<[^<]*<[^<]*\|href="/it/[wr]/[a-z-]*/[^"]*"' 5
          prova /it/w/ro/agata 'glossa-g[^<]*<[^<]*<[^<]*<[^<]*\|href="/it/[wr]/[a-z-]*/[^"]*"' 5
