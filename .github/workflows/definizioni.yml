# Traduzioni e definizioni italiane scritte da Claude (import/definisci.py), con la Batch API. Legge i lotti da
# import/claude/lotti.conf e manda solo le voci che non hanno ancora un risultato. I risultati tornano come commit sullo
# stesso ramo: in dati/definizioni.tsv.gz quelli per il dizionario, in import/claude/esiti/ quelli per i confronti.
# Parte con un push su un ramo definizioni-* che cambia lotti.conf, oppure a mano dalla scheda Actions.
# Serve il segreto ANTHROPIC_API_KEY.
name: Definizioni
on:
  push:
    branches: ['definizioni-*']
    paths: ['import/claude/lotti.conf']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: definizioni-${{ github.ref }}
  cancel-in-progress: false          # un batch già mandato non si butta
jobs:
  definisci:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q anthropic==2.2.0

      - name: Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Manca la chiave::aggiungi il segreto ANTHROPIC_API_KEY nelle impostazioni del repository"; exit 1
          fi
          cd import
          mkdir -p claude/esiti
          # l'impronta degli esiti prima della corsa: nel registro entrano solo quelli che questa corsa ha cambiato
          # (rifondere quelli vecchi riscriverebbe le definizioni aggiunte dopo)
          for f in claude/esiti/*.tsv.gz; do [ -f "$f" ] && sha1sum "$f"; done > /tmp/esiti_prima.txt
          pid=()
          while read -r lotto modello sforzo destinazione; do
            case "$lotto" in ''|'#'*) continue ;; esac
            registro=(); [ "$destinazione" = registro ] && registro=(--registro ../dati/definizioni.tsv.gz)
            [ "$destinazione" = aree ] && registro=(--registro ../dati/aree_radici.tsv.gz)
            python3 definisci.py esegui "claude/$lotto.jsonl.gz" "$modello" "claude/esiti/$lotto.$modello.tsv.gz" \
              --sforzo "$sforzo" "${registro[@]}" &
            pid+=($!)
          done < claude/lotti.conf
          esito=0; for p in "${pid[@]}"; do wait "$p" || esito=1; done
          # i lotti per il dizionario entrano nel registro del pacchetto
          while read -r lotto modello sforzo destinazione; do
            case "$lotto" in ''|'#'*) continue ;; esac
            esito_f="claude/esiti/$lotto.$modello.tsv.gz"
            [ -f "$esito_f" ] || continue
            if grep -qxF "$(sha1sum "$esito_f")" /tmp/esiti_prima.txt; then continue; fi   # non è cambiato
            [ "$destinazione" = registro ] && python3 definisci.py unisci ../dati/definizioni.tsv.gz "$esito_f"
            [ "$destinazione" = aree ] && python3 definisci.py unisci ../dati/aree_radici.tsv.gz "$esito_f"
          done < claude/lotti.conf
          exit $esito

      - name: Commit sul ramo
        if: always()                   # anche dopo un errore o il tempo scaduto: i batch mandati restano ritrovabili
        run: |
          git config user.name "stirps-definizioni"
          git config user.email "stirps-definizioni@users.noreply.github.com"
          for f in dati/definizioni.tsv.gz dati/aree_radici.tsv.gz import/claude/esiti; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "nessun risultato nuovo"; exit 0; fi
          git commit -q -m "Definizioni di Claude: $(ls import/claude/esiti/*.tsv.gz 2> /dev/null | wc -l) esiti ($(date -u +%F))"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep $((2 ** i)); done
          echo "::notice title=Definizioni::commit $(git rev-parse --short HEAD) sul ramo ${GITHUB_REF_NAME}"
