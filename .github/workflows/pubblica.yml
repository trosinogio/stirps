# Pubblicazione: dopo ogni collaudo riuscito su main, oppure a mano dalla scheda Actions.
# In ordine: un ramo di riserva su Neon, il deploy su Vercel (la build applica da sola gli aggiornamenti datati),
# il controllo delle ipotesi verificate. Se un passo fallisce, i successivi non partono: niente deploy senza riserva.
# Richiede i segreti VERCEL_TOKEN, NEON_API_KEY e DATABASE_URL_UNPOOLED (Settings → Secrets and variables → Actions).
name: Pubblica
on:
  workflow_run:
    workflows: [Collaudo]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pubblica
  cancel-in-progress: false
permissions:
  contents: read
env:
  PROGETTO_NEON: aged-truth-35630140
  RAMO_NEON: production
  PROGETTO_VERCEL: dizionario-etimologico
jobs:
  pubblica:
    # dal collaudo: solo se è riuscito e viene da un push su main, non da una pull request
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Segreti
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          manca=""
          for s in VERCEL_TOKEN NEON_API_KEY DATABASE_URL_UNPOOLED; do [ -n "${!s}" ] || manca="$manca $s"; done
          if [ -n "$manca" ]; then
            echo "### Pubblicazione non fatta: mancano i segreti$manca" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Pubblica::mancano i segreti$manca"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Ramo di riserva su Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          api="https://console.neon.tech/api/v2/projects/$PROGETTO_NEON/branches"
          aut="Authorization: Bearer $NEON_API_KEY"
          # letture e cancellazioni si ripetono dopo un guasto passeggero (502 di Neon, 6 novembre 2026); la creazione no
          rami=$(curl -sS --fail-with-body --retry 4 --retry-delay 15 --retry-all-errors --connect-timeout 30 -H "$aut" "$api")
          padre=$(jq -r --arg n "$RAMO_NEON" '.branches[] | select(.name == $n) | .id' <<< "$rami")
          if [ -z "$padre" ]; then echo "::error title=Pubblica::il ramo $RAMO_NEON non c'è su Neon"; exit 1; fi
          # il piano gratuito di Neon ha 10 rami: restano i due rami di riserva più recenti, più quello nuovo.
          # Si tolgono solo i rami che si chiamano backup-*, mai production né altri, e mai quelli con rami figli
          echo "- Rami su Neon: $(jq -r '[.branches[] | "\(.name) (\(.created_at[0:10])\(if .protected then ", protetto" else "" end)\(if .default then ", predefinito" else "" end))"] | join("; ")' <<< "$rami")" >> "$GITHUB_STEP_SUMMARY"
          for vecchio in $(jq -r '[.branches[].parent_id] as $padri | [.branches[] | select((.name | startswith("backup-")) and ([.id] | inside($padri) | not))] | sort_by(.created_at) | reverse | .[2:][] | .id + ":" + .name' <<< "$rami"); do
            r=$(curl -sS -w '\n%{http_code}' --retry 4 --retry-delay 15 --connect-timeout 30 -X DELETE -H "$aut" "$api/${vecchio%%:*}")
            c=${r##*$'\n'}
            if [ "$c" -lt 300 ]; then
              echo "- Tolto il ramo di riserva più vecchio: \`${vecchio#*:}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Neon $c togliendo ${vecchio#*:}::${r%$'\n'*}"
            fi
          done
          nome="backup-$(date -u +%Y-%m-%d-%H%M)"
          scade=$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)
          # se Neon rifiuta, il suo messaggio va nelle annotazioni
          crea() {
            local r c
            r=$(curl -sS -w '\n%{http_code}' -X POST -H "$aut" -H 'Content-Type: application/json' "$api" -d "$1")
            c=${r##*$'\n'}
            [ "$c" -lt 300 ] || { echo "::warning title=Neon $c::${r%$'\n'*}"; return 1; }
          }
          # senza compute, con la scadenza a 30 giorni; se Neon non accetta la scadenza, senza
          crea "$(jq -nc --arg p "$padre" --arg n "$nome" --arg s "$scade" '{branch: {parent_id: $p, name: $n, expires_at: $s}}')" \
            || crea "$(jq -nc --arg p "$padre" --arg n "$nome" '{branch: {parent_id: $p, name: $n}}')"
          echo "::notice title=Ramo di riserva::$nome"
          echo "- Ramo di riserva su Neon: \`$nome\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy su Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROGETTO: ${{ env.PROGETTO_VERCEL }}
        run: |
          # con l'API REST, non con la CLI: il token è un token di progetto (vcp_…), che non vede l'utente,
          # e la CLI con lui si ferma («User not found»)
          if ! out=$(bash scripts/pubblica-vercel-api.sh production 2>&1); then
            echo "$out" | tail -45
            echo "::error title=Deploy::la pubblicazione su Vercel non è riuscita (le ultime righe sono nel registro)"
            exit 1
          fi
          echo "$out"
          url=$(echo "$out" | tail -1)
          echo "::notice title=Deploy::$url"
          echo "- Deploy su Vercel: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Controllo delle ipotesi verificate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          command -v psql > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null; }
          sql() { psql "$DATABASE_URL_UNPOOLED" -X -At -v ON_ERROR_STOP=1 -c "$1"; }
          # se la connessione non riesce, il passo si ferma qui con l'errore di psql
          aggiornato=$(sql "select to_regprocedure('opere_a_sostegno(bigint)') is not null")
          if [ "$aggiornato" != t ]; then
            echo "::error title=Pubblica::gli aggiornamenti del database non risultano applicati"
            exit 1
          fi
          # norme redazionali, «Fonti e citazioni»: un'opera che propone o accoglie, due per la certezza 4
          righe=$(sql "select l.slug || ' «' || h.etichetta || '», certezza ' || h.confidenza || ', opere ' || opere_a_sostegno(h.id)
                         from ipotesi h join lessema l on l.id = h.esito_id
                        where h.stato_editoriale = 'verificato'
                          and (opere_a_sostegno(h.id) = 0 or (h.confidenza = 4 and opere_a_sostegno(h.id) < 2))
                        order by 1")
          if [ -z "$righe" ]; then
            echo "::notice title=Controllo::nessuna ipotesi verificata da rivedere"
            echo "- Controllo: nessuna ipotesi verificata da rivedere." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Ipotesi verificate da rivedere (una fonte in più, o certezza 3):" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r r; do
              echo "::warning title=Da rivedere::$r"
              echo "  - $r" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$righe"
          fi
          # lo spazio occupato: il piano gratuito di Neon ha 0,5 GB
          spazio=$(sql "select pg_size_pretty(pg_database_size(current_database())) || ', ' || (select count(*) from lessema) || ' voci'")
          echo "::notice title=Spazio::$spazio"
          echo "- Spazio occupato: $spazio." >> "$GITHUB_STEP_SUMMARY"
