# Rigenera il pacchetto dati (dati/*.tsv.gz) dai dump di Kaikki: italiano, con la chiusura su latino, francese antico e
# greco antico, e latino e greco interi, con i lemmi del Lewis & Short e del Liddell–Scott–Jones che Wiktionary non ha
# (Perseus Digital Library, CC BY-SA 4.0, file TEI fissati a un commit): import/importa.sh con SOLO_ANALISI=1.
# Le glosse del Wikizionario e di Wikidata restano quelle del pacchetto; le glosse tradotte si aggiungono solo per le
# voci nuove. Il pacchetto torna come commit sullo stesso ramo. Parte con un push su un ramo dati-*, oppure a mano
# dalla scheda Actions.
name: Dati
on:
  push:
    branches: ['dati-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dati-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # con le lingue di chiusura delle parole orfane i dump da leggere sono una sessantina
    env:
      # le lingue di chiusura (import/importa.sh): l'inglese entra con tutte le voci che hanno un'etimologia
      # (CON_ETIMOLOGIA), con l'inglese medio e antico e il norreno (l'anglonormanno su Kaikki non c'è) per chiudere le sue catene
      # francese, tedesco e russo (stima del 6 novembre 2026), con le loro lingue antiche: francese medio, alto tedesco medio
      # e antico, slavo orientale antico e slavo ecclesiastico antico; un dump che Kaikki non ha è solo un avviso
      # e le lingue di cui il dizionario ha già parole senza etimologia (diagnosi del 7 novembre 2026: napoletano 48 su 63,
      # spagnolo 1.648 su 2.281, protoslavo 2.893 su 3.805…): di queste entrano solo le voci che le catene raggiungono
      CHIUSURA: 'la:Latin fro:Old French grc:Ancient Greek en:English enm:Middle English ang:Old English non:Old Norse fr:French frm:Middle French de:German gmh:Middle High German goh:Old High German ru:Russian orv:Old East Slavic cu:Old Church Slavonic
        nap:Neapolitan scn:Sicilian vec:Venetan lij:Ligurian sc:Sardinian lmo:Lombard pms:Piedmontese fur:Friulian es:Spanish osp:Old Spanish pt:Portuguese ca:Catalan oc:Occitan pro:Old Occitan ro:Romanian
        ine-pro:Proto-Indo-European itc-pro:Proto-Italic grk-pro:Proto-Hellenic gem-pro:Proto-Germanic gmw-pro:Proto-West Germanic sla-pro:Proto-Slavic ine-bsl-pro:Proto-Balto-Slavic cel-pro:Proto-Celtic
        nl:Dutch dum:Middle Dutch gml:Middle Low German osx:Old Saxon frk:Frankish got:Gothic yi:Yiddish pl:Polish ga:Irish
        ar:Arabic he:Hebrew sa:Sanskrit hi:Hindi fa:Persian tr:Turkish ota:Ottoman Turkish ja:Japanese
        lt:Lithuanian sga:Old Irish hit:Hittite xcl:Old Armenian ae:Avestan txb:Tocharian B xto:Tocharian A gmy:Mycenaean Greek
        gl:Galician ast:Asturian an:Aragonese co:Corsican lld:Ladin rm:Romansch wa:Walloon frp:Franco-Provençal dlm:Dalmatian
        rup:Aromanian ruq:Megleno-Romanian ruo:Istro-Romanian lad:Ladino egl:Emilian rgn:Romagnol ist:Istriot mxi:Mozarabic
        roa-opt:Old Galician-Portuguese roa-oca:Old Catalan nrf:Norman pcd:Picard
        sv:Swedish da:Danish nb:Norwegian Bokmål nn:Norwegian Nynorsk no:Norwegian is:Icelandic fo:Faroese fy:West Frisian ofs:Old Frisian
        af:Afrikaans lb:Luxembourgish nds:Low German nds-de:German Low German nds-nl:Dutch Low Saxon sco:Scots odt:Old Dutch
        gmq-osw:Old Swedish gmq-oda:Old Danish li:Limburgish gsw:Alemannic German bar:Bavarian pdc:Pennsylvania German stq:Saterland Frisian
        frr:North Frisian ovd:Elfdalian nrn:Norn cim:Cimbrian yol:Yola pdt:Plautdietsch gmq-pro:Proto-Norse lng:Lombardic vls:West Flemish zea:Zealandic'
      # STIMA (17 novembre 2026, ramo dati-stima-germaniche, da non unire): tutte le lingue germaniche intere, inglese e
      # tedesco compresi, per misurare con stima_import.py quanto costa ciascun ambito; le glosse si contano senza tradurle
      INTERE: la,grc,en,de,nl,sv,da,nb,nn,no,is,fo,fy,af,lb,yi,sco,nds,nds-de,nds-nl,li,gsw,bar,pdc,stq,frr,ovd,nrn,cim,yol,pdt,vls,zea,ang,enm,non,gmh,goh,dum,gml,osx,odt,ofs,gmq-osw,gmq-oda,got,frk,lng
      # la stima dopo ogni giro (stima_import.py), per le lingue romanze
      STIMA_LINGUE: en,de,nl,sv,da,nb,nn,no,is,fo,fy,af,lb,yi,sco,nds,nds-de,nds-nl,li,gsw,bar,pdc,stq,frr,ovd,nrn,cim,yol,pdt,vls,zea,ang,enm,non,gmh,goh,dum,gml,osx,odt,ofs,gmq-osw,gmq-oda,got,frk,lng
      STIMA_ATTUALE: '1493'
      STIMA_FREQUENZE: en=dati/frequenze_en.tsv.gz,de=dati/frequenze_de.tsv.gz,nl=dati/frequenze_nl.tsv.gz,sv=dati/frequenze_sv.tsv.gz,da=dati/frequenze_da.tsv.gz,nb=dati/frequenze_no.tsv.gz,no=dati/frequenze_no.tsv.gz,nn=dati/frequenze_no.tsv.gz,is=dati/frequenze_is.tsv.gz
      # sotto le voci dei rami antichi e del latino entrano anche i discendenti dichiarati che il dizionario non ha
      # (import/wiktionary.py; il latino dal 15 novembre 2026, decisione di Giovanni: le lingue romanze)
      # e sotto il protobaltoslavo e il protoceltico (16 novembre 2026: lituano e irlandese antico, con l'ittita, per il
      # confronto indoeuropeo, solo con le parole che stanno in una famiglia)
      SEMINA_DISCENDENTI: ine-pro,grk-pro,grc,gem-pro,sla-pro,la,ine-bsl-pro,cel-pro
      # le lingue antiche del confronto entrano anche dal basso (16 novembre 2026): un lemma che nessuna catena raggiunge
      # entra se un etimo della sua pagina è già nel dizionario (l'ittita: gli alberi citano 386 parole, quasi tutte
      # temi o forme senza pagina, e ne entravano 25; delle 515 pagine ittite 337 hanno un'etimologia)
      RISALI: hit,xcl,ae,txb,xto,gmy,sa,got,cu,lt,sga
      # le lingue romanze con tutte le voci che hanno un'etimologia, senza nomi propri, locuzioni e contrazioni (decisione
      # di Giovanni, 16 novembre 2026, «ambito B» della stima: 209 mila voci); il francese non ha più l'elenco del lessico comune
      CON_ETIMOLOGIA: ru,es,pt,ca,ro,gl,oc,fr,fro,frm,osp,roa-opt,roa-oca,pro,nap,scn,vec,lij,sc,lmo,pms,fur,ast,an,co,lld,rm,wa,frp,dlm,rup,ruq,ruo,lad,egl,rgn,ist,mxi,nrf,pcd
      # dell'inglese, il lessico comune (i lemmi tra le 50 mila forme più frequenti) e le parole con l'etimo fuori
      # dall'inglese (ESTERNI), senza nomi propri né locuzioni
      # la stessa regola per francese, tedesco e russo (stima del 6 novembre 2026: 114 MB invece di 239 per le lingue intere)
      # l'italiano anche con i lemmi senza etimologia del lessico comune (referto), per l'analisi di un testo
      COMUNI: it=../dati/frequenze_it.tsv.gz
      ELENCHI: ru=../dati/frequenze_ru.tsv.gz
      ESTERNI: ru
      GLOSSE_TRADOTTE: '0'   # 0: si contano le voci da tradurre senza tradurle (per una stima)
      # esempi grezzi dei modelli italiani che il filtro non legge ancora, nel registro (filtra.py), per imparare a leggerli
      DIAGNOSI_MODELLI: internationalism,it-verb-verb,m+,clq
      # i modelli grezzi di alcune parole, per capire perché la loro etimologia non si legge (le cime greche del 13 novembre)
      DIAGNOSI_PAROLE: classer,calculer,sulfure,algie,preot,agăța,كتاب,مكتبة,كاتب,مدرسة
      # le glosse con cui le pagine citano le radici ricostruite, per il controllo delle radici omografe
      GLOSSE_RADICI: /tmp/glosse_radici.tsv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dump di Kaikki ed etimologie
        run: |
          cd import
          # le glosse già pubblicate (il pacchetto di main) restano, se sono ancora tra le candidate
          git fetch -q --depth 1 origin main && git show FETCH_HEAD:dati/lessemi.tsv.gz > /tmp/precedenti.tsv.gz
          PRECEDENTI=/tmp/precedenti.tsv.gz SOLO_ANALISI=1 WIKIZIONARIO=0 ./importa.sh
          jq -c . dati/it/rapporto_parser.json
          echo "::notice title=Parser::$(jq -c '{lessemi, ipotesi, relazioni, voci, intere_la, intere_grc, intere_en, intere_fr, intere_de, intere_ru, lemmi_interi_la, lemmi_interi_grc}' dati/it/rapporto_parser.json)"
          echo "::notice title=Perseus::$(tail -1 dati/it/rapporto_perseus.txt)"
          echo "::notice title=Greco, regole apprese::$(head -2 dati/it/rapporto_greco.txt | tr '\n' ' ')"

      - name: Etimologie del Wikizionario e diagnosi delle mancanti
        run: |
          cd import
          cut -f3 dati/it/senza_etimologia.tsv | sort | uniq -c
          # le etimologie italiane del Wikizionario (etimi_wikizionario.py) vanno nelle righe degli etimi dei dizionari; se il
          # dump non si scarica si tengono quelle del pacchetto di main, perché un pacchetto senza le toglierebbe dal sito
          if curl -sf -o /tmp/wikizionario.jsonl "https://kaikki.org/itwiktionary/All%20languages%20combined/kaikki.org-dictionary-all.jsonl"; then
            python3 etimi_wikizionario.py dati/it/tsv/etimi_dizionari.tsv dati/it/tsv/lessemi.tsv dati/it/tsv/dizionari.tsv < /tmp/wikizionario.jsonl 2> /tmp/wikizionario.txt
            cat /tmp/wikizionario.txt
            echo "::notice title=Wikizionario::$(head -1 /tmp/wikizionario.txt)"
            python3 diagnosi_wikizionario.py dati/it/senza_etimologia.tsv < /tmp/wikizionario.jsonl | tee /tmp/diagnosi.txt || true
            echo "::notice title=Etimologie mancanti::$(head -2 /tmp/diagnosi.txt | tr '\n' ' ')"
            rm -f /tmp/wikizionario.jsonl
          else
            echo "::warning title=Wikizionario::dump non scaricabile: restano le etimologie del Wikizionario del pacchetto di main"
            git fetch -q --depth 1 origin main
            (git show FETCH_HEAD:dati/etimi_dizionari.tsv.gz 2> /dev/null | zcat | grep -P '\tWikizionario(-[a-z]+)?$' || true) \
              >> dati/it/tsv/etimi_dizionari.tsv
          fi
          # i due Wiktionary a confronto: dove c'è già un'etimologia inglese, la riga del Wikizionario concorda o discorda
          python3 confronta_wikizionario.py dati/it/tsv/etimi_dizionari.tsv dati/it/tsv/lessemi.tsv dati/it/tsv/ipotesi.tsv \
            dati/it/tsv/relazioni.tsv 2> /tmp/confronto.txt
          cat /tmp/confronto.txt
          echo "::notice title=Due Wiktionary::$(head -1 /tmp/confronto.txt)"

      - name: Etimologie del Wiktionnaire e confronto per il francese e il greco antico
        run: |
          cd import
          # le etimologie francesi del Wiktionnaire (etimi_wiktionnaire.py), come per il Wikizionario. Il dump è grande:
          # si legge mentre si scarica, e le righe entrano solo se lo scaricamento arriva in fondo
          rm -f /tmp/etimi_fr.tsv
          if curl -sf "https://kaikki.org/frwiktionary/All%20languages%20combined/kaikki.org-dictionary-all.jsonl" \
               | LINGUE_WIKTIONNAIRE=fr,grc GREZZE=/tmp/grezze_wiktionnaire.tsv \
                 python3 etimi_wiktionnaire.py /tmp/etimi_fr.tsv dati/it/tsv/lessemi.tsv dati/it/tsv/dizionari.tsv 2> /tmp/wiktionnaire.txt; then
            cat /tmp/etimi_fr.tsv >> dati/it/tsv/etimi_dizionari.tsv
            cat /tmp/wiktionnaire.txt
            echo "::notice title=Wiktionnaire::$(grep '^etimologie del Wiktionnaire' /tmp/wiktionnaire.txt | tr '\n' ' ')"
          else
            cat /tmp/wiktionnaire.txt || true
            echo "::warning title=Wiktionnaire::dump non scaricabile: restano le etimologie del Wiktionnaire del pacchetto di main"
            git fetch -q --depth 1 origin main
            (git show FETCH_HEAD:dati/etimi_dizionari.tsv.gz 2> /dev/null | zcat | grep -P '\tWiktionnaire(-[a-z]+)?$' || true) \
              >> dati/it/tsv/etimi_dizionari.tsv
          fi
          python3 confronta_wikizionario.py dati/it/tsv/etimi_dizionari.tsv dati/it/tsv/lessemi.tsv dati/it/tsv/ipotesi.tsv \
            dati/it/tsv/relazioni.tsv fr Wiktionnaire 2> /tmp/confronto_fr.txt
          cat /tmp/confronto_fr.txt
          echo "::notice title=Wiktionary e Wiktionnaire::$(head -1 /tmp/confronto_fr.txt)"
          # il greco antico del Wiktionnaire (15 novembre 2026): stessa regola dei due Wiktionary, sulla parola greca
          python3 confronta_wikizionario.py dati/it/tsv/etimi_dizionari.tsv dati/it/tsv/lessemi.tsv dati/it/tsv/ipotesi.tsv \
            dati/it/tsv/relazioni.tsv grc Wiktionnaire 2> /tmp/confronto_grc.txt
          cat /tmp/confronto_grc.txt
          echo "::notice title=Wiktionary e Wiktionnaire (greco antico)::$(head -1 /tmp/confronto_grc.txt)"
          # la sandbox di Claude non scarica gli artefatti: le frasi grezze del greco e il registro su un ramo di servizio
          if [ -s /tmp/grezze_wiktionnaire.tsv ]; then
            rm -rf /tmp/misure_wn && mkdir /tmp/misure_wn && cp /tmp/grezze_wiktionnaire.tsv /tmp/wiktionnaire.txt /tmp/confronto_grc.txt /tmp/misure_wn/
            (cd /tmp/misure_wn && git init -q && git add -A && git -c user.name=dati -c user.email=dati@users.noreply.github.com commit -qm "Wiktionnaire: frasi grezze e conti" \
              && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/misure-wiktionnaire) || true
          fi

      - name: Voci vere per il banco di prova
        run: |
          cd import/dati
          echo "--- la/lemmi.jsonl: levir"; grep -m1 '"w": "levir"' la/lemmi.jsonl || true
          echo "--- la/glosse.tsv: levir"; grep -m2 -P '^levir\t' la/glosse.tsv || true
          echo "--- grc/lemmi.jsonl: δαήρ"; grep -m1 '"w": "δαήρ"' grc/lemmi.jsonl || true
          echo "--- grc/glosse.tsv: δαήρ"; grep -m2 -P '^δαήρ\t' grc/glosse.tsv || true
          echo "--- la/lemmi.jsonl: ricostruzioni"; grep -m3 '"rec": true' la/lemmi.jsonl || true

      - name: Glosse tradotte per le voci nuove
        run: |
          cd import
          mkdir -p modelli
          ok=1
          for m in en_it it_en; do
            curl -sfL -o "modelli/$m.zip" "https://argos-net.com/v1/translate-${m}-1_0.argosmodel" && unzip -q -o "modelli/$m.zip" -d "modelli/$m" || ok=0
          done
          if [ "$ok" != 1 ]; then
            echo "::warning title=Glosse tradotte::modelli Argos non scaricabili: restano le traduzioni del pacchetto"
            exit 0
          fi
          dir() { dirname "$(find "modelli/$1" -name sentencepiece.model | head -1)"; }
          andata=$(dir en_it); ritorno=$(dir it_en)
          pip install -q ctranslate2 sentencepiece
          # le voci straniere con una glossa inglese, senza glossa del Wikizionario e senza una traduzione già fatta:
          # quelle di Wiktionary e quelle dei dizionari, che hanno lo stesso formato
          cat dati/it/tsv/lessemi.tsv dati/it/tsv/dizionari.tsv > voci.tsv
          python3 - <<'PY'
          import gzip
          from collections import Counter
          # le glosse del Wikizionario che l'import usa davvero: niente segnaposto, niente parole con omografi
          # (importa_glosse_wikizionario()); le voci con omografi si traducono dalla loro glossa inglese
          omografi = Counter(tuple(r.split('\t')[1:3]) for r in open('voci.tsv', encoding='utf-8'))
          wz = {tuple(c[:2]) for c in (r.rstrip('\n').split('\t') for r in gzip.open('../dati/glosse_it.tsv.gz', 'rt', encoding='utf-8'))
                if len(c) > 4 and 'definizione mancante' not in c[4].lower() and omografi[tuple(c[:2])] <= 1}
          # già tentate: la stessa voce con la stessa glossa inglese, confermata o scartata (terza colonna vuota)
          gia = {tuple(r.rstrip('\n').split('\t')[:2]) for r in gzip.open('../dati/glosse_tradotte.tsv.gz', 'rt', encoding='utf-8')}
          n = 0
          with open('chiavi.txt', 'w', encoding='utf-8') as out:
              for r in open('voci.tsv', encoding='utf-8'):
                  c = r.rstrip('\n').split('\t')
                  if len(c) < 8 or c[1] == 'it' or c[7] in ('', '\\N') or (c[0], c[7]) in gia or (c[1], c[2]) in wz:
                      continue
                  out.write(c[0] + '\n'); n += 1
          print(f'voci da tradurre: {n}')
          PY
          if [ "$GLOSSE_TRADOTTE" = 0 ]; then
            echo "::notice title=Glosse tradotte::non tradotte (GLOSSE_TRADOTTE=0): $(wc -l < chiavi.txt) voci da tradurre"
            exit 0
          fi
          for p in 1 2 3 4; do
            python3 traduci_glosse.py voci.tsv "$andata" "tradotte_$p.tsv" --ritorno "$ritorno" --chiavi chiavi.txt \
              --parte "$p/4" --vocabolario ../dati/frequenze_it.tsv.gz,dati/it/tsv/lessemi.tsv &
          done
          wait
          # le traduzioni di prima per le voci che ci sono ancora, più le nuove
          python3 - <<'PY'
          import glob, gzip
          attuali = {r.split('\t')[0] for r in open('voci.tsv', encoding='utf-8')}
          righe = {}
          for r in gzip.open('../dati/glosse_tradotte.tsv.gz', 'rt', encoding='utf-8'):
              if r.split('\t')[0] in attuali:
                  righe[r.split('\t')[0]] = r.rstrip('\n')
          prima = len(righe)
          for f in sorted(glob.glob('tradotte_*.tsv')):
              for r in open(f, encoding='utf-8'):
                  righe[r.split('\t')[0]] = r.rstrip('\n')
          with open('glosse_tradotte.tsv', 'w', encoding='utf-8') as out:
              for k in sorted(righe):
                  out.write(righe[k] + '\n')
          print(f'glosse tradotte: {prima} di prima, {len(righe) - prima} nuove')
          PY
          gzip -9 -n -c glosse_tradotte.tsv > ../dati/glosse_tradotte.tsv.gz
          echo "::notice title=Glosse tradotte::$(zcat ../dati/glosse_tradotte.tsv.gz | awk -F'\t' '$3 != ""' | wc -l) confermate, $(zcat ../dati/glosse_tradotte.tsv.gz | wc -l) tentate"

      - name: Pacchetto dati
        run: |
          t=import/dati/it/tsv
          for f in lingue lessemi ipotesi relazioni doppioni radici attestazioni dizionari autori stime pronunce sensi etimi_dizionari; do
            gzip -9 -n -c "$t/$f.tsv" > "dati/$f.tsv.gz"
          done
          # le forme flesse più frequenti e i loro lemmi, per l'analisi di un testo (forma_lemma)
          python3 import/forme_frequenti.py dati/frequenze_it.tsv.gz import/dati/it/forme.tsv "$t/lessemi.tsv" import/dati/it/forme_analisi.tsv > /tmp/forme_it.tsv
          gzip -9 -n -c /tmp/forme_it.tsv > dati/forme_it.tsv.gz
          # voci per lingua, prima e dopo
          conta() { awk -F'\t' '{c[$2]++} END {for (k in c) print k, c[k]}' | sort; }
          prima() {
            git show HEAD:dati/lessemi.tsv.gz | zcat
            if git cat-file -e HEAD:dati/dizionari.tsv.gz 2> /dev/null; then git show HEAD:dati/dizionari.tsv.gz | zcat; fi
          }
          prima | conta > /tmp/prima.txt
          zcat dati/lessemi.tsv.gz dati/dizionari.tsv.gz | conta > /tmp/dopo.txt
          join -a1 -a2 -e 0 -o 0,1.2,2.2 /tmp/prima.txt /tmp/dopo.txt | sort -k3 -n -r | head -12 > /tmp/confronto.txt
          cat /tmp/confronto.txt
          echo "::notice title=Voci per lingua (prima, dopo)::$(tr '\n' ';' < /tmp/confronto.txt)"
          ls -la dati/

      - name: Analizzatore etimologico (conteggio)
        continue-on-error: true
        run: |
          cd import
          python3 analizza.py conta dati/it/glosse.tsv ../dati | tee /tmp/analisi.txt
          echo "::notice title=Analizzatore::$(head -1 /tmp/analisi.txt)"

      - name: Controllo delle radici
        run: |
          python3 import/controlla_radici.py dati | tee /tmp/radici.txt
          echo "::notice title=Radici::$(head -6 /tmp/radici.txt | tr '\n' ' ')"

      - name: Linea del senso
        run: |
          # tra una parola e il suo etimo una linea di senso evidente (glosse con una parola in comune) negli archi veri e
          # nelle coppie a caso; e gli archi tra parole ricostruite della stessa lingua senza linea, da guardare
          python3 import/controlla_sensi.py dati/lessemi.tsv.gz dati/ipotesi.tsv.gz dati/relazioni.tsv.gz 2> /tmp/sensi.txt
          cat /tmp/sensi.txt
          echo "::notice title=Linea del senso::$(head -1 /tmp/sensi.txt) $(grep 'stessa lingua' /tmp/sensi.txt)"

      - name: Radici omografe
        continue-on-error: true
        run: |
          # una pagina cita una radice con un senso che non è quello della radice (*tewk- «gonfiarsi» e «premere»)?
          cd import
          python3 controlla_omografe.py /tmp/glosse_radici.tsv /tmp/omografe_fuori.tsv | tee /tmp/omografe.txt
          echo "::notice title=Radici omografe::$(head -2 /tmp/omografe.txt | tr '\n' ' ')"
          python3 -c "import json; s = json.load(open('dati/it/rapporto_parser.json')); print('::notice title=Omografe per glossa::' + str({k: v for k, v in s.items() if k.startswith('omografe')}))" || true

      - name: Discendenti dichiarati
        continue-on-error: true
        run: |
          # l'albero dei discendenti di Wiktionary concorda con le etimologie che abbiamo già? (misura, prima di usarlo)
          cd import
          python3 controlla_discendenti.py dati/it/tsv 'dati/*/discendenti.tsv' /tmp/discendenti_archi.tsv | tee /tmp/discendenti.txt
          echo "::notice title=Discendenti::$(head -2 /tmp/discendenti.txt | tr '\n' ' ')"
          python3 -c "import json; s = json.load(open('dati/it/rapporto_parser.json')); print('::notice title=Discendenti collegati::' + str({k: v for k, v in s.items() if k.startswith('discendenti')}))" || true
          for f in dati/*/discendenti.tsv; do l=$(basename $(dirname $f)); sed "s/^/$l\t/" $f; done | gzip -9 > /tmp/discendenti.tsv.gz
          # la sandbox di Claude non scarica gli artefatti: l'albero va anche su un ramo di servizio senza storia
          rm -rf /tmp/misure && mkdir /tmp/misure && cd /tmp/misure && git init -q && cp /tmp/discendenti.tsv.gz /tmp/discendenti.txt /tmp/discendenti_archi.tsv . 2>/dev/null
          gzip -9 discendenti_archi.tsv
          git add -A && git -c user.name=dati -c user.email=dati@users.noreply.github.com commit -qm "Discendenti dichiarati: l'albero e la misura"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/misure-discendenti

      - name: Discendenti (artefatto)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: discendenti
          path: |
            /tmp/discendenti.txt
            /tmp/discendenti_archi.tsv
            /tmp/discendenti.tsv.gz
          retention-days: 14

      - name: Glosse delle radici (artefatto)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: glosse-radici
          path: |
            /tmp/glosse_radici.tsv
            /tmp/omografe_fuori.tsv
          retention-days: 14

      - name: Stima dell'import
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p /tmp/prima
          # rispetto al pacchetto pubblicato, quello di main
          git fetch -q --depth 1 origin main
          for f in lessemi ipotesi relazioni attestazioni; do git show FETCH_HEAD:dati/$f.tsv.gz > /tmp/prima/$f.tsv.gz; done
          python3 import/stima_import.py /tmp/prima dati "${STIMA_LINGUE:-es,pt}" --attuale "${STIMA_ATTUALE:-1053}" \
            ${STIMA_FREQUENZE:+--frequenze "$STIMA_FREQUENZE"} | tee /tmp/stima.txt
          echo "::notice title=Stima::$(head -4 /tmp/stima.txt | tr '\n' ' ')"

      - name: Commit sul ramo
        run: |
          git config user.name "stirps-dati"
          git config user.email "stirps-dati@users.noreply.github.com"
          git add dati/
          if git diff --cached --quiet; then echo "il pacchetto non è cambiato"; exit 0; fi
          git commit -q -m "Pacchetto dati: italiano con latino e greco interi e i dizionari del Perseus (Kaikki, $(date -u +%F))"
          git push -q
          echo "::notice title=Pacchetto::commit $(git rev-parse --short HEAD) sul ramo ${GITHUB_REF_NAME}"
