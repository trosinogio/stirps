# Rigenera il pacchetto dati (dati/*.tsv.gz) dai dump di Kaikki: italiano, con la chiusura su latino, francese antico e
# greco antico, e latino e greco interi, con i lemmi del Lewis & Short e del Liddell–Scott–Jones che Wiktionary non ha
# (Perseus Digital Library, CC BY-SA 4.0, file TEI fissati a un commit): import/importa.sh con SOLO_ANALISI=1.
# Le glosse del Wikizionario e di Wikidata restano quelle del pacchetto; le glosse tradotte si aggiungono solo per le
# voci nuove. Il pacchetto torna come commit sullo stesso ramo. Parte con un push su un ramo dati-*, oppure a mano
# dalla scheda Actions.
name: Dati
on:
  push:
    branches: ['dati-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dati-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # le lingue di chiusura (import/importa.sh): l'inglese entra con tutte le voci che hanno un'etimologia
      # (CON_ETIMOLOGIA), con l'inglese medio e antico e il norreno (l'anglonormanno su Kaikki non c'è) per chiudere le sue catene
      # francese, tedesco e russo (stima del 6 novembre 2026), con le loro lingue antiche: francese medio, alto tedesco medio
      # e antico, slavo orientale antico e slavo ecclesiastico antico; un dump che Kaikki non ha è solo un avviso
      CHIUSURA: 'la:Latin fro:Old French grc:Ancient Greek en:English enm:Middle English ang:Old English non:Old Norse fr:French frm:Middle French de:German gmh:Middle High German goh:Old High German ru:Russian orv:Old East Slavic cu:Old Church Slavonic'
      INTERE: la,grc
      CON_ETIMOLOGIA: en,fr,de,ru
      # dell'inglese, il lessico comune (i lemmi tra le 50 mila forme più frequenti) e le parole con l'etimo fuori
      # dall'inglese (ESTERNI), senza nomi propri né locuzioni
      # la stessa regola per francese, tedesco e russo (stima del 6 novembre 2026: 114 MB invece di 239 per le lingue intere)
      ELENCHI: en=../dati/frequenze_en.tsv.gz fr=../dati/frequenze_fr.tsv.gz de=../dati/frequenze_de.tsv.gz ru=../dati/frequenze_ru.tsv.gz
      ESTERNI: en,fr,de,ru
      GLOSSE_TRADOTTE: '1'   # 0: si contano le voci da tradurre senza tradurle (per una stima)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dump di Kaikki ed etimologie
        run: |
          cd import
          # le glosse già pubblicate (il pacchetto di main) restano, se sono ancora tra le candidate
          git fetch -q --depth 1 origin main && git show FETCH_HEAD:dati/lessemi.tsv.gz > /tmp/precedenti.tsv.gz
          PRECEDENTI=/tmp/precedenti.tsv.gz SOLO_ANALISI=1 WIKIZIONARIO=0 ./importa.sh
          jq -c . dati/it/rapporto_parser.json
          echo "::notice title=Parser::$(jq -c '{lessemi, ipotesi, relazioni, voci, intere_la, intere_grc, intere_en, intere_fr, intere_de, intere_ru, lemmi_interi_la, lemmi_interi_grc}' dati/it/rapporto_parser.json)"
          echo "::notice title=Perseus::$(tail -1 dati/it/rapporto_perseus.txt)"

      - name: Diagnosi delle etimologie mancanti
        continue-on-error: true          # una diagnosi: se il Wikizionario non si scarica, il pacchetto va avanti
        run: |
          cd import
          cut -f3 dati/it/senza_etimologia.tsv | sort | uniq -c
          curl -sf "https://kaikki.org/itwiktionary/All%20languages%20combined/kaikki.org-dictionary-all.jsonl" \
            | python3 diagnosi_wikizionario.py dati/it/senza_etimologia.tsv | tee /tmp/diagnosi.txt
          echo "::notice title=Etimologie mancanti::$(head -2 /tmp/diagnosi.txt | tr '\n' ' ')"

      - name: Voci vere per il banco di prova
        run: |
          cd import/dati
          echo "--- la/lemmi.jsonl: levir"; grep -m1 '"w": "levir"' la/lemmi.jsonl || true
          echo "--- la/glosse.tsv: levir"; grep -m2 -P '^levir\t' la/glosse.tsv || true
          echo "--- grc/lemmi.jsonl: δαήρ"; grep -m1 '"w": "δαήρ"' grc/lemmi.jsonl || true
          echo "--- grc/glosse.tsv: δαήρ"; grep -m2 -P '^δαήρ\t' grc/glosse.tsv || true
          echo "--- la/lemmi.jsonl: ricostruzioni"; grep -m3 '"rec": true' la/lemmi.jsonl || true

      - name: Glosse tradotte per le voci nuove
        run: |
          cd import
          mkdir -p modelli
          ok=1
          for m in en_it it_en; do
            curl -sfL -o "modelli/$m.zip" "https://argos-net.com/v1/translate-${m}-1_0.argosmodel" && unzip -q -o "modelli/$m.zip" -d "modelli/$m" || ok=0
          done
          if [ "$ok" != 1 ]; then
            echo "::warning title=Glosse tradotte::modelli Argos non scaricabili: restano le traduzioni del pacchetto"
            exit 0
          fi
          dir() { dirname "$(find "modelli/$1" -name sentencepiece.model | head -1)"; }
          andata=$(dir en_it); ritorno=$(dir it_en)
          pip install -q ctranslate2 sentencepiece
          # le voci straniere con una glossa inglese, senza glossa del Wikizionario e senza una traduzione già fatta:
          # quelle di Wiktionary e quelle dei dizionari, che hanno lo stesso formato
          cat dati/it/tsv/lessemi.tsv dati/it/tsv/dizionari.tsv > voci.tsv
          python3 - <<'PY'
          import gzip
          wz = {tuple(r.split('\t')[:2]) for r in gzip.open('../dati/glosse_it.tsv.gz', 'rt', encoding='utf-8')}
          # già tentate: la stessa voce con la stessa glossa inglese, confermata o scartata (terza colonna vuota)
          gia = {tuple(r.rstrip('\n').split('\t')[:2]) for r in gzip.open('../dati/glosse_tradotte.tsv.gz', 'rt', encoding='utf-8')}
          n = 0
          with open('chiavi.txt', 'w', encoding='utf-8') as out:
              for r in open('voci.tsv', encoding='utf-8'):
                  c = r.rstrip('\n').split('\t')
                  if len(c) < 8 or c[1] == 'it' or c[7] in ('', '\\N') or (c[0], c[7]) in gia or (c[1], c[2]) in wz:
                      continue
                  out.write(c[0] + '\n'); n += 1
          print(f'voci da tradurre: {n}')
          PY
          if [ "$GLOSSE_TRADOTTE" = 0 ]; then
            echo "::notice title=Glosse tradotte::non tradotte (GLOSSE_TRADOTTE=0): $(wc -l < chiavi.txt) voci da tradurre"
            exit 0
          fi
          for p in 1 2 3 4; do
            python3 traduci_glosse.py voci.tsv "$andata" "tradotte_$p.tsv" --ritorno "$ritorno" --chiavi chiavi.txt \
              --parte "$p/4" --vocabolario ../dati/frequenze_it.tsv.gz,dati/it/tsv/lessemi.tsv &
          done
          wait
          # le traduzioni di prima per le voci che ci sono ancora, più le nuove
          python3 - <<'PY'
          import glob, gzip
          attuali = {r.split('\t')[0] for r in open('voci.tsv', encoding='utf-8')}
          righe = {}
          for r in gzip.open('../dati/glosse_tradotte.tsv.gz', 'rt', encoding='utf-8'):
              if r.split('\t')[0] in attuali:
                  righe[r.split('\t')[0]] = r.rstrip('\n')
          prima = len(righe)
          for f in sorted(glob.glob('tradotte_*.tsv')):
              for r in open(f, encoding='utf-8'):
                  righe[r.split('\t')[0]] = r.rstrip('\n')
          with open('glosse_tradotte.tsv', 'w', encoding='utf-8') as out:
              for k in sorted(righe):
                  out.write(righe[k] + '\n')
          print(f'glosse tradotte: {prima} di prima, {len(righe) - prima} nuove')
          PY
          gzip -9 -n -c glosse_tradotte.tsv > ../dati/glosse_tradotte.tsv.gz
          echo "::notice title=Glosse tradotte::$(zcat ../dati/glosse_tradotte.tsv.gz | awk -F'\t' '$3 != ""' | wc -l) confermate, $(zcat ../dati/glosse_tradotte.tsv.gz | wc -l) tentate"

      - name: Pacchetto dati
        run: |
          t=import/dati/it/tsv
          for f in lingue lessemi ipotesi relazioni doppioni radici attestazioni dizionari autori stime pronunce; do
            gzip -9 -n -c "$t/$f.tsv" > "dati/$f.tsv.gz"
          done
          # voci per lingua, prima e dopo
          conta() { awk -F'\t' '{c[$2]++} END {for (k in c) print k, c[k]}' | sort; }
          prima() {
            git show HEAD:dati/lessemi.tsv.gz | zcat
            if git cat-file -e HEAD:dati/dizionari.tsv.gz 2> /dev/null; then git show HEAD:dati/dizionari.tsv.gz | zcat; fi
          }
          prima | conta > /tmp/prima.txt
          zcat dati/lessemi.tsv.gz dati/dizionari.tsv.gz | conta > /tmp/dopo.txt
          join -a1 -a2 -e 0 -o 0,1.2,2.2 /tmp/prima.txt /tmp/dopo.txt | sort -k3 -n -r | head -12 > /tmp/confronto.txt
          cat /tmp/confronto.txt
          echo "::notice title=Voci per lingua (prima, dopo)::$(tr '\n' ';' < /tmp/confronto.txt)"
          ls -la dati/

      - name: Controllo delle radici
        run: |
          python3 import/controlla_radici.py dati | tee /tmp/radici.txt
          echo "::notice title=Radici::$(head -6 /tmp/radici.txt | tr '\n' ' ')"

      - name: Stima dell'import
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p /tmp/prima
          # rispetto al pacchetto pubblicato, quello di main
          git fetch -q --depth 1 origin main
          for f in lessemi ipotesi relazioni attestazioni; do git show FETCH_HEAD:dati/$f.tsv.gz > /tmp/prima/$f.tsv.gz; done
          python3 import/stima_import.py /tmp/prima dati fr,de,ru --attuale 557 \
            --frequenze fr=dati/frequenze_fr.tsv.gz,de=dati/frequenze_de.tsv.gz,ru=dati/frequenze_ru.tsv.gz | tee /tmp/stima.txt
          echo "::notice title=Stima::$(head -4 /tmp/stima.txt | tr '\n' ' ')"

      - name: Commit sul ramo
        run: |
          git config user.name "stirps-dati"
          git config user.email "stirps-dati@users.noreply.github.com"
          git add dati/
          if git diff --cached --quiet; then echo "il pacchetto non è cambiato"; exit 0; fi
          git commit -q -m "Pacchetto dati: italiano con latino e greco interi e i dizionari del Perseus (Kaikki, $(date -u +%F))"
          git push -q
          echo "::notice title=Pacchetto::commit $(git rev-parse --short HEAD) sul ramo ${GITHUB_REF_NAME}"
